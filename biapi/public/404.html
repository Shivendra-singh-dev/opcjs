<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin:0; padding:1.5rem;
            color: #0f172a;
        }
        .error-container {
            max-width: 600px; width:100%;
            background: #ffffff; border-radius:24px; padding:3rem 2.5rem;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #e9edf2;
        }
        .error-code {
            display: inline-block; background: #eef2f6; color:#475569;
            padding:0.25rem 1.25rem; border-radius:40px; font-size:0.875rem;
            font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
            margin-bottom:1.5rem;
        }
        .error-icon { font-size:4.5rem; line-height:1; margin-bottom:1rem; display:block; }
        h1 { font-size:2.5rem; font-weight:800; margin-bottom:0.75rem; color:#0f172a; }
        p { color:#475569; font-size:1.125rem; line-height:1.6; margin-bottom:2rem; }
        .home-link {
            display:inline-block; background:#0f172a; color:white; text-decoration:none;
            font-weight:600; padding:0.75rem 2.5rem; border-radius:40px; font-size:1rem;
            transition: background 0.2s, transform 0.1s; box-shadow:0 4px 12px rgba(15,23,42,0.12);
        }
        .home-link:hover { background:#1e293b; transform:scale(1.02); }
        .home-link:active { transform:scale(0.98); }
        .footer { margin-top:2.5rem; color:#94a3b8; font-size:0.875rem; border-top:1px solid #e9edf2; padding-top:1.5rem; }
        @media (max-width:480px) { .error-container { padding:2rem 1.5rem; } h1 { font-size:2rem; } .error-icon { font-size:3.5rem; } }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="error-code">404</span>
        <span class="error-icon">🔍</span>
        <h1>Page not found</h1>
        <p>
            The page you are looking for doesn’t exist or has been moved.
            <br />
            Check the URL or return to the homepage.
        </p>
        <a href="/" class="home-link">← Back to home</a>
        <div class="footer">&copy; 2026 Your Company. All rights reserved.</div>
    </div>
</body>
</html>
